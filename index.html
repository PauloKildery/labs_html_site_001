<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Shopping App</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
      <div class="container header-content">

        <a href="#" class="logo">
          FASHION
        </a>

        <nav class="navigation" aria-label="Navegação principal">
          <ul class="nav-list">

            <li>
              <a href="#">CATALOGUE</a>
            </li>

            <li>
              <a href="#">FASHION</a>
            </li>

            <li>
              <a href="#">FAVOURITE</a>
            </li>

            <li>
              <a href="#">LIFESTYLE</a>
            </li>

          </ul>
        </nav>

        <a href="#" class="btn-signup">
          SIGN UP
        </a>

      </div>
    </header>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main>

      <!-- =========================
           HERO
      ========================== -->

      <section class="hero">

        <div class="container hero-content">

          <!-- Texto da Hero -->

          <div class="hero-text">

            <h1>
              <span class="highlight-white">LET'S</span><br />
              EXPLORE<br />
              <span class="highlight-yellow">UNIQUE</span><br />
              CLOTHES
            </h1>

            <p>
              Live for influential and innovative fashion!
            </p>

            <a href="#" class="btn-shop">
              SHOP NOW
            </a>

          </div>


          <!-- Imagem da Hero -->

          <div class="hero-image">

            <img
              src="assets/images/hero-model.png"
              alt="Modelo apresentando coleção de moda"
            />

          </div>

        </div>

      </section>


      <!-- =========================
           MARCAS
      ========================== -->

     <!-- =========================
     MARCAS
========================= -->

<section class="brands">

  <div class="container brands-content">

    <!-- H&M -->
    <div class="brand-item">
      <img
        src="assets/brands/hm.svg"
        alt="H&M"
        class="brand-logo"
      />
    </div>

    <!-- OBEY -->
    <div class="brand-item">
      <img
        src="assets/brands/obey.svg"
        alt="Obey"
        class="brand-logo"
      />
    </div>

    <!-- SHOPIFY -->
    <div class="brand-item">
      <img
        src="assets/brands/shopify.svg"
        alt="Shopify"
        class="brand-logo"
      />
    </div>

    <!-- LACOSTE -->
    <div class="brand-item">
      <img
        src="assets/brands/lacoste.svg"
        alt="Lacoste"
        class="brand-logo"
      />
    </div>

    <!-- LEVI'S -->
    <div class="brand-item">
      <img
        src="assets/brands/levis.svg"
        alt="Levi's"
        class="brand-logo"
      />
    </div>

    <!-- AMAZON -->
    <div class="brand-item">
      <img
        src="assets/brands/amazon.svg"
        alt="Amazon"
        class="brand-logo"
      />
    </div>

  </div>

</section>

    </main>


 
    

  </body>
</html>
